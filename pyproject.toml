[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantie"
version = "0.1.0"
description = "Polymarket BTC 5-minute up/down trading bot"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client-v2==1.0.1",
    "websockets>=12.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "lightgbm>=4.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "tenacity>=8.3",
    "structlog>=24.2",
    "prometheus-client>=0.20",
    "web3==7.12.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "freezegun>=1.5",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.scripts]
quantie = "quantie.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
